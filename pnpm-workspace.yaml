# Workspaces visible to pnpm: every directory under apps/ and packages/ that
# contains a package.json (apps/web, packages/logger, packages/sdk-typescript,
# ...). Python apps (apps/api, apps/ingest, apps/identity) live in this repo
# too but are invisible to pnpm — uv manages those separately.
packages:
  - "apps/*"
  - "packages/*"
